- aid: salsify:mcp
  name: Salsify MCP Server
  description: >-
    First-party remote Model Context Protocol server hosted by Salsify at app.salsify.com/mcp. Streamable
    HTTP transport, protected by OAuth 2.1 with RFC 9728 protected-resource metadata pointing at the app.salsify.com
    authorization server; tools/list requires an authenticated bearer token.
  humanURL: https://app.salsify.com/mcp
  baseURL: https://app.salsify.com/mcp
