apis:
- aid: salsify:rest
  name: Salsify REST API
  description: 'The Salsify REST API gives programmatic access to everything in a Salsify
    organization: products, records, properties, digital assets, list membership, imports
    and export runs. All request and response bodies are JSON, requests are authenticated
    with a per-user API key (or an OAuth 2.0 bearer token) in the Authorization header,
    and every organization is limited to 10,000 requests per hour.'
  humanURL: https://developers.salsify.com/reference
  baseURL: https://app.salsify.com/api/v1/orgs
  tags:
  - Products
  - Records
  - Properties
  - Digital Assets
  - Imports
