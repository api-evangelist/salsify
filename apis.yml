- aid: salsify:graphql
  name: Salsify GraphQL API
  description: 'Early-access public GraphQL API for operating on Salsify accounts, organizations,
    configuration manifests and organization provisioning requests. Authenticated with
    a bearer API token; introspection requires authentication, and the published schema
    reference is mirrored in graphql/.'
  humanURL: https://developers.salsify.com/reference/graphql-schema-overview
  baseURL: https://api.salsify.com/graphql
  tags:
  - GraphQL
  - Accounts
  - Organizations
  properties:
  - type: GraphQL
    url: graphql/salsify-graphql.yml
  - type: GraphQLSchema
    url: graphql/salsify-graphql-schema-overview.md
  - type: Documentation
    url: https://developers.salsify.com/docs/graphql-authorization
- aid: salsify:mcp
  name: Salsify MCP Server
  description: 'First-party remote Model Context Protocol server hosted by Salsify at
    app.salsify.com/mcp. Streamable HTTP transport, protected by OAuth 2.1 with RFC 9728
    protected-resource metadata pointing at the app.salsify.com authorization server;
    tools/list requires an authenticated bearer token.'
  humanURL: https://app.salsify.com/mcp
  baseURL: https://app.salsify.com/mcp
  tags:
  - MCP
  - Agents
  properties:
  - type: MCPServer
    url: mcp/salsify-mcp.yml
  - type: ToolCrosswalk
    url: mcp/salsify-tool-crosswalk.yml
