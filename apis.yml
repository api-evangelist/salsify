aid: salsify
name: Salsify
description: 'Salsify is a product experience management (PXM) and supplier experience
  management (SXM) platform used by brands, distributors and retailers to centralize
  product content, digital assets and syndication to the digital shelf. The Salsify
  platform exposes a REST API at app.salsify.com/api/v1/orgs covering products, records,
  properties, digital assets, list membership, imports and export runs, an early-access
  GraphQL API at api.salsify.com/graphql for accounts, organizations and configuration
  manifests, a webhook surface for product, digital asset, channel and import events
  with X.509/SHA-256 signature verification, and an OAuth 2.0 authorization server
  plus a first-party Model Context Protocol server at app.salsify.com/mcp.'
