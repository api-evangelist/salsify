    and organization provisioning requests. Authenticated with a bearer API token; introspection requires
    authentication, and the published schema reference is mirrored in graphql/.
  humanURL: https://developers.salsify.com/reference/graphql-schema-overview
  baseURL: https://api.salsify.com/graphql
