generated: '2026-08-02'
method: searched
source: https://developers.salsify.com/docs/rate-limiting-1
docs: https://developers.salsify.com/docs/rate-limiting-1
scope: per organization
rate_limits:
- name: API (API key and OAuth 2.0)
  limit_count: 10000
  limit_period: hour
  scope: organization
  applies_to:
  - api-key
  - oauth2
  note: >-
    Enforced per organization regardless of which user makes the request. A user who
    belongs to multiple organizations gets a separate limit per organization.
- name: Session (interactive application use)
  limit_count: 5000
  limit_period: hour
  scope: user
  applies_to:
  - session
  note: Interactive/session requests do not count against the 10,000/hour organization limit.
headers:
- name: x-ratelimit-limit
  description: Total number of requests available to the requesting token.
- name: x-ratelimit-remaining
  description: Number of requests remaining for the current hour.
- name: x-ratelimit-reset
  description: Seconds until the rate limit resets; always the top of the hour.
exceeded:
  status: 429
  reason: Too Many Requests
  reset: Counter resets at the start of each clock hour.
